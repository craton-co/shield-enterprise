name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      with:
        toolchain: stable
    - name: Install cargo-audit
      # Version pinned to match `.github/workflows/ci.yml` (supply-chain job)
      # and `.github/workflows/release.yml` (verify job) so the nightly
      # Security workflow, per-PR supply-chain gate, and release verify gate
      # exercise the same auditor (MED-3, MED-12).
      uses: taiki-e/install-action@37461a1de4134bec92ef79ff5d032a53de2c4e85 # v2
      with:
        tool: cargo-audit@0.21.2
    - name: Security Audit
      run: cargo audit

  deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      with:
        toolchain: stable
    - name: Install cargo-deny
      # Version pinned to match `.github/workflows/ci.yml` (supply-chain job)
      # and `.github/workflows/release.yml` (verify job) so the nightly
      # Security workflow, per-PR supply-chain gate, and release verify gate
      # apply the same policy engine (MED-3, MED-12).
      uses: taiki-e/install-action@37461a1de4134bec92ef79ff5d032a53de2c4e85 # v2
      with:
        tool: cargo-deny@0.18.2
    - name: Check dependencies
      run: cargo deny check

  sbom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
      with:
        toolchain: stable
    - name: Install cargo-cyclonedx
      # Pinned to the same version referenced by `scripts/generate-sbom.sh`
      # and `.github/workflows/release.yml`. When bumping, update ALL THREE
      # locations together so SBOMs produced locally, by the nightly Security
      # workflow, and by the Release workflow remain byte-identical (MED-12).
      uses: taiki-e/install-action@37461a1de4134bec92ef79ff5d032a53de2c4e85 # v2
      with:
        tool: cargo-cyclonedx@0.5.7
    - name: Generate SBOM
      run: bash scripts/generate-sbom.sh
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: sbom-cyclonedx
        path: artifacts/
        retention-days: 90
    - name: Publish SBOM to release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
      with:
        files: artifacts/*.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
