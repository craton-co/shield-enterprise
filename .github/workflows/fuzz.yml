name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 6' # Every Saturday at 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  FUZZ_DURATION: 300 # 5 minutes per target

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - can_frame
          - eth_packet
          - ota_metadata
          - uds_request
          - tara_input
          - iec62443_capabilities
          - iec62304_input
          - telemetry_entry
          - pkcs11_mock_crypto
          - tpm_ec_point
          - qnx_can_parse
          - qnx_eth_parse
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Setup Rust (nightly for libFuzzer)
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # nightly
      with:
        toolchain: nightly
    - name: Install cargo-fuzz
      uses: taiki-e/install-action@37461a1de4134bec92ef79ff5d032a53de2c4e85 # v2
      with:
        tool: cargo-fuzz@0.12.0
    - name: Run fuzzer (${{ matrix.target }})
      run: |
        cargo +nightly fuzz run ${{ matrix.target }} \
          -- -max_total_time=${{ env.FUZZ_DURATION }}
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fuzz-crashes-${{ matrix.target }}
        path: fuzz/artifacts/${{ matrix.target }}/
