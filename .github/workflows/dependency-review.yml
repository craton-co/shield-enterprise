name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Dependency review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        # Keep this list in sync with `deny.toml` [licenses] allow.
        # MPL-2.0 removed (weak-copyleft, disallowed by deny.toml).
        # Unicode-3.0 added (required by transitive dep `unicode-ident`).
        # BSL-1.1 retained: applies to first-party crates only (see deny.toml).
        allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-DFS-2016, Unicode-3.0, CC0-1.0, Zlib, BSL-1.1
        comment-summary-in-pr: on-failure
