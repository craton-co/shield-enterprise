name: DCO

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0
    - name: Verify Signed-off-by on every commit
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        missing=0
        while IFS= read -r sha; do
          if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
            echo "::error::Commit $sha is missing a Signed-off-by trailer"
            missing=1
          fi
        done < <(git log --no-merges --format=%H "${BASE_SHA}..${HEAD_SHA}")
        if [ "$missing" -ne 0 ]; then
          echo "DCO check failed. Use 'git commit -s' to sign off commits."
          exit 1
        fi
        echo "All commits carry a Signed-off-by trailer."
